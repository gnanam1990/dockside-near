[workspace]
resolver = "2"
members = ["crates/dockside-canonical", "crates/dockside-escrow-core", "crates/dockside-escrow"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Host tests sign and verify many Ed25519 payloads; optimize dependencies (not the crates under
# test, which keep debug assertions and overflow checks) so generated-sequence tests stay fast.
[profile.dev.package."*"]
opt-level = 2
