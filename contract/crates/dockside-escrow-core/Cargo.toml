[package]
name = "dockside-escrow-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dockside escrow authority logic (terms, per-funder ledger, refunds, holds, evidence) shared by the NEAR contract and host tests"

[dependencies]
dockside-canonical = { path = "../dockside-canonical" }
borsh = { version = "=1.8.1", features = ["derive"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154" }
hex = "=0.4.3"
sha2 = "=0.10.9"
