[package]
name = "dockside-canonical"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dockside Canonical Encoding v1 (DCE-1), byte-identical to packages/core/src/canonical.ts"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
serde_json = "=1.0.154"
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["std"] }
bs58 = "=0.5.1"
hex = "=0.4.3"
