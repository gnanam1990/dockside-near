[package]
name = "dockside-sandbox-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "near-sdk unit-testing host tests and near-workspaces tests of the escrow contract on a local near-sandbox node"

[dependencies]
dockside-fixtures = { path = "../fixtures" }
dockside-escrow-core = { path = "../../crates/dockside-escrow-core" }
serde_json = { version = "=1.0.154" }
hex = "=0.4.3"
sha2 = "=0.10.9"
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
near-workspaces = { version = "=0.24.0", default-features = false, features = ["rustls"] }
near-sandbox = "=0.4.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
anyhow = "=1.0.104"

[dev-dependencies]
dockside-escrow = { path = "../../crates/dockside-escrow" }
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
